<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf7f1" />
    <meta name="description" content="A focused, local-first English study companion for verbs, prepositions, phrasal verbs and everyday filler." />
    <title>Quiet Library — English practice</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("quietlibrary:theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (saved ? saved === "dark" : prefersDark) {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
